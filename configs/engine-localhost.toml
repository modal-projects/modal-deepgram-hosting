# Engine config for all-in-one deployment (localhost communication)
# This is a copy of engine.toml with localhost URLs

[license]
server_url = ["https://localhost:8443", "https://license.deepgram.com"]

[server]
host = "0.0.0.0"
port = 8090  # Using 8090 to avoid conflict with API's 8080

[metrics_server]
host = "0.0.0.0"
port = 9991

[model_manager]
search_paths = ["/models"]

[features]
multichannel = true
language_detection = true
streaming_ner = true
use_v2_language_detection = false

[flux]
enabled = false

[health]
# gpu_required = true

